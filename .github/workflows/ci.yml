name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: License declarations
        run: py -3.12 scripts/check_licenses.py

      - name: Pull request size warning
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          py -3.12 scripts/check_pr_size.py --base origin/${{ github.base_ref }}

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Supply chain
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: "--locked"
          rust-version: "1.99.1"

      - name: Check
        run: cargo check --workspace --locked

      - name: Download pinned public STDF samples
        run: py -3.12 examples/public-stdf/download.py

      - name: Test
        env:
          ZSTDF_REQUIRE_PUBLIC: "1"
        run: cargo test --workspace --locked

      - name: Fuzz smoke
        run: cargo run -p stdf-core --bin fuzz_decode -- --iterations 1500 --max-len 1024

      - name: Performance smoke
        run: cargo run -p stdf-core --bin perf_baseline -- --parts 1000 --tests-per-part 5

      - name: Parquet performance smoke
        run: cargo run -p stdf-parquet --bin parquet_perf -- --parts 1000 --tests-per-part 5 --batch-size 4096

      - name: Analytics spill smoke
        run: cargo run -p stdf-analytics --bin spill_stress -- 10000

      - name: Build release CLI
        run: cargo build --release -p stdf-cli --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Viewer demo and smoke
        run: |
          py -3.12 examples/viewer/generate_demo.py
          npm install --no-save playwright
          node scripts/smoke_viewer.cjs

  fuzz:
    name: cargo-fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.1

      - name: Seed corpus
        run: python3 fuzz/seed_corpus.py

      - name: decode_all smoke
        working-directory: fuzz
        run: cargo +nightly fuzz run decode_all -- -max_total_time=20

      - name: truncate_prefix smoke
        working-directory: fuzz
        run: cargo +nightly fuzz run truncate_prefix -- -max_total_time=20

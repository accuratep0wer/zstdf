<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>zstdf Engineering Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;font:12px system-ui;background:var(--ui-bg);color:var(--ui-ink)}button,input,select{font:inherit;border:1px solid var(--ui-line);padding:4px 7px;border-radius:2px}button{cursor:pointer}button.active{outline:2px solid var(--ui-accent)}[hidden]{display:none!important}#report-settings{margin:0;max-width:none;position:sticky;top:0;z-index:12}header#toolbar{padding:8px;border-radius:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:16px!important;margin:0 12px 0 0}#filename{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#workspace{display:grid;grid-template-columns:290px minmax(400px,1fr);height:calc(100vh - 145px);gap:5px;padding:5px}#navigation{resize:horizontal;overflow:auto;min-width:220px;max-width:650px;border:1px solid var(--ui-line);background:var(--ui-surface)}#nav-tabs{display:flex;flex-wrap:wrap;gap:3px;padding:6px;border-bottom:1px solid var(--ui-line)}#nav-content{overflow:auto;height:calc(100% - 100px)}#nav-content table{min-width:100%;font-size:11px}#nav-content tr{cursor:pointer}#panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));align-content:start;overflow:auto;gap:5px}article.pane{height:420px;min-width:0;min-height:260px;resize:vertical;overflow:hidden;border:1px solid var(--ui-line);background:var(--ui-surface);display:flex;flex-direction:column}.pane-head{display:flex;gap:4px;align-items:center;padding:5px;background:var(--ui-th);flex-wrap:wrap}.pane-head strong{margin-right:auto}.pane-meta{padding:4px 7px;color:var(--ui-muted);font-size:11px}.pane-body{flex:1;overflow:auto;position:relative}.table-scroll{height:100%;overflow:auto;position:relative}.table-scroll table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%}th,td{height:24px;max-height:24px;padding:2px 6px;border-right:1px solid var(--ui-line);border-bottom:1px solid var(--ui-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}th{position:sticky;top:0;z-index:3;background:var(--ui-th);cursor:pointer;resize:horizontal;overflow:auto;min-width:65px}.filters th{top:24px;background:var(--ui-blue)}.filters input{width:100%;min-width:55px;padding:1px;height:20px}.frozen{position:sticky;left:0;z-index:2;background:var(--ui-surface)}th.frozen{z-index:5}tr.selected td{background:var(--ui-blue)}td.annotation{width:24px;text-align:center}.failed td.annotation{color:var(--ui-bad-ink);background:var(--ui-bad)}.excluded td{opacity:.55;text-decoration:line-through}.pane-foot{display:flex;gap:5px;padding:4px;align-items:center;border-top:1px solid var(--ui-line)}.ruler{position:absolute;right:0;top:0;bottom:0;width:10px;z-index:6;background:var(--ui-control)}.ruler button{position:absolute;left:0;width:9px;height:3px;padding:0;background:var(--ui-bad-ink);border:0}.chart{min-width:0;width:100%;height:300px}.chart text{font-family:system-ui;fill:var(--ui-ink)}.chart .hit{cursor:pointer}.chart .hit:hover{opacity:.65}.legend{display:flex;gap:9px;flex-wrap:wrap;padding:4px 8px}.legend i{width:9px;height:9px;display:inline-block;margin-right:4px}#status{padding:5px 10px;background:var(--ui-surface);border-top:1px solid var(--ui-line)}#message{color:var(--ui-bad-ink);white-space:pre-wrap}dialog{max-width:95vw;width:1000px;max-height:90vh;overflow:auto;border:1px solid var(--ui-line)}dialog pre{white-space:pre-wrap;word-break:break-all;font-size:11px}dialog table{border-collapse:collapse;width:100%;table-layout:fixed}dialog td{height:auto;white-space:normal;word-break:break-word}label.inline{display:inline-flex;gap:5px;align-items:center}.properties{display:grid;grid-template-columns:180px 1fr;gap:10px}.info{padding:12px;white-space:pre-wrap}.empty{padding:20px;color:var(--ui-muted)}@media(max-width:800px){#workspace{display:block;height:auto}#navigation{width:100%!important;max-width:none;height:260px;resize:none}#panes{display:block}.pane{margin-top:6px}#filename{max-width:160px}}
.tab-group{min-width:400px;resize:horizontal;overflow:auto;border:1px solid var(--ui-line)}.group-tabs{display:flex;gap:4px;padding:4px;background:var(--ui-th)}.pane-foot{flex-wrap:wrap}.tab-group .pane{border:0}
</style></head><body>
<header id="toolbar"><h1 data-i18n="Engineering Viewer">Engineering Viewer</h1><span id="filename"></span><label><span data-i18n="Run">Run</span> <select id="run"><option value="">All</option></select></label><label><span data-i18n="Wafer">Wafer</span> <select id="wafer"><option value="">All</option></select></label><label><span data-i18n="Population">Population</span> <select id="population"><option value="latest" data-i18n="Latest">Latest</option><option value="first" data-i18n="First">First</option><option value="all" data-i18n="All attempts">All attempts</option></select></label><button id="add" data-i18n="Show In">Show In</button><button id="save" data-i18n="Save session">Save session</button><button id="load" data-i18n="Load session">Load session</button><button id="export" data-i18n="Export HTML">Export HTML</button><button id="reset" data-i18n="Reset analysis">Reset analysis</button></header>
<main id="workspace"><aside id="navigation"><nav id="nav-tabs"></nav><input id="nav-search" placeholder="Search" data-i18n-placeholder="Search" style="width:100%"><div id="nav-content"></div><div id="nav-pages"></div></aside><section id="panes"></section></main>
<footer id="status"><span id="counts"></span> <span id="message" role="status"></span></footer><dialog id="dialog"></dialog><input type="file" id="session-file" accept=".json" hidden>
<script type="application/json" id="viewer-boot">__VIEWER_BOOT__</script><script>window.VIEWER_API='__VIEWER_API__';</script><script>__VIEWER_SCRIPT__</script></body></html>

[package]
name = "stdf-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stdf-core = { path = "../stdf-core" }
memmap2.workspace = true
thiserror.workspace = true
flate2.workspace = true

# Not workspace = true: Cargo rejects mixing inherited lints with an override.
# unsafe_code is deny here, not forbid, so StdfReader::open can allow mmap.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

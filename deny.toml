# Supply-chain policy checked by `cargo deny check` in CI.
# Path dependencies inside this workspace have no version requirement, so
# wildcard bans are allowed. Duplicate crate versions warn and do not fail CI.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
yanked = "deny"
# Parquet 60.1.0 no longer depends on thrift or paste, and it pulls zstd 0.14.3.
# pyo3 0.29 clears the advisories that were ignored while arrow 55 pinned 0.24.

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "stdf-parquet"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stdf-core = { path = "../stdf-core" }
stdf-arrow = { path = "../stdf-arrow" }
stdf-io = { path = "../stdf-io" }
flate2.workspace = true
parquet.workspace = true
arrow.workspace = true
thiserror.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

# Not workspace = true: Cargo rejects mixing inherited lints with an override.
# unsafe_code is deny here, not forbid, so the FFI helpers can allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

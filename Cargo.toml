[workspace]
members = [
    "stdf-core",
    "stdf-io",
    "stdf-arrow",
    "stdf-parquet",
    "stdf-py",
    "stdf-cli",
    "stdf-validate",
    "stdf-ascii",
    "stdf-analytics",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
thiserror = "2"
arrow = { version = "60" }
parquet = { version = "60", features = ["arrow"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
flate2 = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Production code forbids unsafe. stdf-io and stdf-parquet override this to
# deny and allow it only on the mmap and FFI functions. unwrap and panic are
# denied outside tests (see clippy.toml). expect_used and indexing_slicing stay
# off: CI passes `-D warnings`, so a warn-level lint would fail the build, and
# indexing_slicing would flag ordinary parser indexing.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"


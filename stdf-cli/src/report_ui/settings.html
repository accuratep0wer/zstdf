html[data-theme] .pass,html[data-theme] .ok,html[data-theme] .tested,html[data-theme] .retest_consistent,html[data-theme] .status-valid,html[data-theme] #fp .fp-pass{background:var(--ui-good);color:var(--ui-good-ink)}html[data-theme] .fail,html[data-theme] .bad,html[data-theme] .missing,html[data-theme] .retest_different,html[data-theme] .status-invalid,html[data-theme] #fp .fp-fail{background:var(--ui-bad);color:var(--ui-bad-ink)}html[data-theme] .warn,html[data-theme] .indeterminate,html[data-theme] #fp .fp-unknown{background:var(--ui-warn);color:var(--ui-warn-ink)}html[data-theme] .pending{background:var(--ui-blue);color:var(--ui-blue-ink)}html[data-theme] .neutral,html[data-theme] .not_applicable,html[data-theme] .status-missing,html[data-theme] .status-unknown,html[data-theme] .status-empty,html[data-theme] .status-not_checked{background:var(--ui-gray);color:var(--ui-gray-ink)}html[data-theme] #fp .fp-track{background:var(--ui-th)}html[data-theme] #fp .fp-bar{background:var(--ui-bad-ink)}html[data-theme] #fp .fp-dot{background:var(--ui-accent)}html[data-theme=contrast] th{font-weight:800}html[data-theme=quality] .panel{border-radius:0}

<div id="report-settings" role="group" aria-label="Report appearance">
<span id="report-settings-note" data-i18n="Style and language changes preserve filters, sorting and the selected device. Raw data is not translated."></span>
<label><span data-i18n="Page style">Page style</span><select id="report-theme" aria-label="Page style"></select></label>
<label><span data-i18n="Language">Language</span><select id="report-language" aria-label="Language"><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="en">English</option><option value="de">Deutsch</option></select></label>
</div>
<script id="report-translations" type="application/json">__REPORT_TRANSLATIONS__</script>
<script>
(()=>{'use strict';
const dictionary=JSON.parse(document.getElementById('report-translations').textContent), langs=['en','zh','ja','ko','de'],themes=['excel','mes','dark','quality','contrast'];
const themeNames=['01 · Excel classic','02 · MES industrial blue','03 · Night shift dark','04 · Quality review','05 · High-contrast monitor'];
const query=new URLSearchParams(location.search);let saved={};try{saved=JSON.parse(localStorage.getItem('zstdf-report-ui')||'{}')}catch{}
let lang=langs.includes(query.get('lang'))?query.get('lang'):langs.includes(saved.lang)?saved.lang:'en';
let theme=themes.includes(query.get('theme'))?query.get('theme'):themes.includes(saved.theme)?saved.theme:'mes';
const t=(key,values={})=>{const text=dictionary[key]?.[langs.indexOf(lang)]??key;return String(text).replace(/\{(\w+)\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(values,k)?String(values[k]):m)};
function translate(root=document){root.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));root.querySelectorAll('[data-i18n-placeholder]').forEach(n=>n.placeholder=t(n.dataset.i18nPlaceholder));root.querySelectorAll('[data-i18n-label]').forEach(n=>n.setAttribute('aria-label',t(n.dataset.i18nLabel)));}
function apply(){document.documentElement.dataset.theme=theme;document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.getElementById('report-language').value=lang;const select=document.getElementById('report-theme');select.replaceChildren(...themes.map((value,i)=>new Option(t(themeNames[i]),value)));select.value=theme;translate();}
window.ReportUI={t,translate,get language(){return lang},get theme(){return theme},color(name){return getComputedStyle(document.documentElement).getPropertyValue('--ui-'+name).trim()}};
function update(){apply();try{localStorage.setItem('zstdf-report-ui',JSON.stringify({theme,lang}))}catch{}try{const url=new URL(location.href);url.searchParams.set('theme',theme);url.searchParams.set('lang',lang);history.replaceState(null,'',url)}catch{}window.dispatchEvent(new CustomEvent('report-ui-change'));translate();}
document.getElementById('report-language').onchange=e=>{lang=e.target.value;update()};document.getElementById('report-theme').onchange=e=>{theme=e.target.value;update()};
apply();document.addEventListener('DOMContentLoaded',()=>{translate();window.dispatchEvent(new CustomEvent('report-ui-change'));});
})();
</script>
